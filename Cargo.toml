[package]
name = "islewright"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "A solitaire dice game: roll, then build roads, villages, castles and traders across a small island."
repository = "https://github.com/Islewright-Roll/Islewright-Roll"
publish = false

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# Cargo defaults to rlib; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"

[dependencies]
day = { package = "day-app", version = "0.6.3", features = ["model"] }
day-piece-settings = { version = "0.6.3" }
# Sound effects, haptics, and the accelerometer that tells which way a phone was turned.
day-part-sound = "0.6.3"
day-part-haptics = "0.6.3"
day-part-sensors = "0.6.3"
# The items are saved as JSON in the preferences (src/model.rs).
serde = { version = "1", features = ["derive"] }
# Decodes the art. Pure Rust, MIT or Apache-2.0.
png = "0.18"
# Already in the tree through png; used directly for the frame checksums, which dominate
# encoding a frame.
crc32fast = "1"
simd-adler32 = "0.3"

# The wall clock on the web: wasm32 has no working SystemTime, and Day's web toolkit reads the
# page's Date.now() for it (src/clock.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
day-toolkit-dom = "0.6.3"

# What dialogs need of the window, which Day has no call for (src/ui/window.rs).
[target.'cfg(target_os = "android")'.dependencies]
day-bridge = "0.6.3"
day-platform-android = "0.6.3"

[build-dependencies]
day-build = { version = "0.6.3" }


# Day 0.6.3 plus the changes this game needs that are not in a Day release yet: pixel art drawn
# without smoothing, every finger reported on its own, a sound clip restarted, and the Menu key.
# They are on the `islewright` branch of the game's public fork of Day, pinned here by commit so
# every build, the App Fair's included, compiles the same source; .github/workflows/ci.yml builds
# the day CLI from the same commit, so move the two together. Drop this table once a Day release
# carries the changes. A local `day patch --local` checkout still takes precedence over it.
[patch.crates-io]
day-app = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
day-async = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
day-bridge = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
day-build = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
day-core = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
day-fonts = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
day-geometry = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
day-localization = { git = "https://github.com/Islewright-Roll/day", rev = "27190907f66960ea2ebfc500783e09d7762d2eae" }
