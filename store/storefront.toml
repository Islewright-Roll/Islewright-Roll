[storefront.submission-info]
# contact-email = "" # where a store reviewer writes back; left unset in the public repository
review-notes = """
Islewright: Roll is a single player dice game with no account, no network use and no permissions.
Tap Roll, tap dice to keep them, roll again up to three times, then tap a highlighted spot on
the board to build. A tutorial runs on the first game and can be shown again from Settings.
"""

[storefront.metadata]
name = "Islewright: Roll" # ≤30, the App Store name and Play title
subtitle = "A solitaire dice island game"
short = "Roll dice, then build roads, villages, castles and traders on a small island."
description = """
Roll the dice, keep the ones you want, and spend what they show to build roads, villages, \
castles and traders across a small island.

Each turn you get three rolls. Tap dice to keep them, roll the rest, then build whatever your \
resources pay for. Roads open up sites for villages and castles. Two gold stand in for any one \
resource, and traders bank a resource for a later turn.

Two islands, each with its own game in progress:
• Tarnholm: fifteen turns around a lake. Score as much as you can before the King's ship \
reaches the pier.
• Dunholm: a race to ten points in as few turns as you can.

A short tutorial teaches the rules in your first game, and your top scores are kept for each \
island.

Islewright: Roll is free, with no ads, no in-app purchases, no tracking and no account. It works \
offline and asks for no permissions. It is open source under the GNU GPL, and its island art \
comes from The Battle for Wesnoth.
"""
keywords = ["dice", "solitaire", "board game", "island", "strategy", "puzzle", "offline", "pixel art"] # App Store only; ≤100 characters joined
release-notes = """
Islewright: Roll's first release on the App Fair: both islands, the tutorial and top scores, now on \
iPhone and Android.
"""
